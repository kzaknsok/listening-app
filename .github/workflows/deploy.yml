name: Build and Deploy WASM Subtitle App

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Emscripten環境でCコードをWASMにコンパイル
      - name: Build WASM using Emscripten
        run: |
          docker run --rm -v $(pwd):/src -u $(id -u):$(id -g) emscripten/emsdk \
            emcc src/sync.c -O3 \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_find_subtitle_id", "_malloc", "_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","setValue"]' \
            -o web/sync.js

      # 2. アセットファイルのコピー & manifest.json の自動生成
      - name: Copy Assets and Generate Manifest
        run: |
          cp -r assets/* web/
          cd web
          # mp3 と json の両方が揃っているベース名のみを抽出して manifest.json に保存
          for f in *.json; do
            base="${f%.json}"
            if [ -f "${base}.mp3" ] && [ "$base" != "manifest" ]; then
              echo "$base"
            fi
          done | jq -R . | jq -s . > manifest.json

      # 3. GitHub Pages へデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web