name: Build and Deploy WASM Subtitle App

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Emscripten環境でCコードをWASMにコンパイル
      - name: Build WASM using Emscripten
        run: |
          docker run --rm -v $(pwd):/src -u $(id -u):$(id -g) emscripten/emsdk \
            emcc src/sync.c -O3 \
            -s WASM=1 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","setValue"]' \
            -o web/sync.js

      # 2. アセットファイルを web フォルダにコピー
      - name: Copy Assets
        run: |
          cp assets/script.json web/
          cp assets/easy_english_01.wav web/

      # 3. GitHub Pages へデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web